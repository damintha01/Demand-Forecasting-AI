{% extends "_auth_base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
  <h1>Create your account</h1>
  <p class="sub">Start forecasting demand in under a minute.</p>

  {% for message in get_flashed_messages() %}
    <div class="flash" role="alert">{{ message }}</div>
  {% endfor %}

  <form method="post">
    <div class="field">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name" value="{{ form.full_name if form else '' }}" autocomplete="name" required autofocus>
    </div>
    <div class="row">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form.username if form else '' }}" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form.email if form else '' }}" autocomplete="email" required>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required>
      </div>
    </div>
    <button type="submit" class="btn btn-block">Create account</button>
  </form>

  <div class="switch">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </div>
{% endblock %}
